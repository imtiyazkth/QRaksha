name: Update free threat-intel blocklists

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure output dirs exist
        run: mkdir -p docs/data/blocklists

      - name: Fetch OpenPhish community feed
        continue-on-error: true
        run: |
          curl -sL --max-time 30 "https://openphish.com/feed.txt" \
            -o /tmp/openphish_raw.txt \
            || (echo "OpenPhish unavailable"; touch /tmp/openphish_raw.txt)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/openphish_raw.txt \
            --output docs/data/blocklists/openphish.json \
            --source "OpenPhish community feed (free, no API key)"

      - name: Fetch URLhaus active feed
        continue-on-error: true
        run: |
          curl -sL --max-time 30 \
            "https://urlhaus.abuse.ch/downloads/text_online/" \
            -o /tmp/urlhaus_raw.txt \
            || (echo "URLhaus unavailable"; touch /tmp/urlhaus_raw.txt)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/urlhaus_raw.txt \
            --output docs/data/blocklists/urlhaus.json \
            --source "URLhaus (abuse.ch) — free, no API key"

      - name: Fetch URLhaus recent feed
        continue-on-error: true
        run: |
          curl -sL --max-time 30 \
            "https://urlhaus.abuse.ch/downloads/text_recent/" \
            -o /tmp/urlhaus_recent_raw.txt \
            || (echo "URLhaus recent unavailable"; touch /tmp/urlhaus_recent_raw.txt)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/urlhaus_recent_raw.txt \
            --output docs/data/blocklists/urlhaus-recent.json \
            --source "URLhaus recent (abuse.ch) — last 30 days"

      - name: Fetch Block List Project scam feed
        continue-on-error: true
        run: |
          curl -sL --max-time 30 \
            "https://blocklistproject.github.io/Lists/scam.txt" \
            -o /tmp/blp_scam_raw.txt \
            || (echo "BLP unavailable"; touch /tmp/blp_scam_raw.txt)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/blp_scam_raw.txt \
            --output docs/data/blocklists/blp-scam.json \
            --source "Block List Project — scam sites (Unlicense)"

      - name: Fetch Phishing Army extended
        continue-on-error: true
        run: |
          curl -sL --max-time 60 \
            "https://phishing.army/download/phishing_army_blocklist_extended.txt" \
            -o /tmp/phishing_army_raw.txt \
            || (echo "Phishing Army unavailable"; touch /tmp/phishing_army_raw.txt)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/phishing_army_raw.txt \
            --output docs/data/blocklists/phishing-army.json \
            --source "Phishing Army extended (PhishTank+OpenPhish+Cert.pl+URLscan)"

      - name: Fetch ThreatFox recent IOCs
        continue-on-error: true
        run: |
          curl -sL --max-time 60 \
            -X POST "https://threatfox-api.abuse.ch/api/v1/" \
            -H "Content-Type: application/json" \
            -d '{"query":"get_iocs","days":7}' \
            -o /tmp/threatfox_raw.json \
            || (echo "ThreatFox unavailable"; echo '{"query_status":"no_results","data":[]}' > /tmp/threatfox_raw.json)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/threatfox_raw.json \
            --output docs/data/blocklists/threatfox.json \
            --source "ThreatFox (abuse.ch) — community IOC feed, free" \
            --format threatfox

      - name: Fetch AlienVault OTX pulse feed
        continue-on-error: true
        run: |
          curl -sL --max-time 60 \
            "https://reputation.alienvault.com/reputation.data" \
            -o /tmp/otx_raw.txt \
            || (echo "OTX unavailable"; touch /tmp/otx_raw.txt)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/otx_raw.txt \
            --output docs/data/blocklists/alienvault-otx.json \
            --source "AlienVault OTX reputation feed (free)"

      - name: Fetch Spamhaus DROP list
        continue-on-error: true
        run: |
          curl -sL --max-time 30 \
            "https://www.spamhaus.org/drop/drop.txt" \
            -o /tmp/spamhaus_raw.txt \
            || (echo "Spamhaus unavailable"; touch /tmp/spamhaus_raw.txt)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/spamhaus_raw.txt \
            --output docs/data/blocklists/spamhaus-drop.json \
            --source "Spamhaus DROP list (free, nonprofit)" \
            --format ip

      - name: Fetch PhishHunt live feed
        continue-on-error: true
        run: |
          curl -sL --max-time 30 \
            "https://phishunt.io/api/suspects/" \
            -H "Accept: application/json" \
            -o /tmp/phishunt_raw.json \
            || (echo "PhishHunt unavailable"; echo "[]" > /tmp/phishunt_raw.json)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/phishunt_raw.json \
            --output docs/data/blocklists/phishunt.json \
            --source "phishunt.io live feed" \
            --format json

      - name: Fetch PhishTank bulk feed (optional)
        continue-on-error: true
        env:
          PHISHTANK_KEY: ${{ secrets.PHISHTANK_API_KEY }}
        if: env.PHISHTANK_KEY != ''
        run: |
          curl -sL --max-time 60 \
            "https://data.phishtank.com/data/${PHISHTANK_KEY}/online-valid.json" \
            -o /tmp/phishtank_raw.json \
            || (echo "PhishTank unavailable"; exit 0)
          node .github/scripts/build-blocklist.js \
            --input  /tmp/phishtank_raw.json \
            --output docs/data/blocklists/phishtank.json \
            --source "PhishTank bulk data (registered API key)" \
            --format json

      - name: Commit refreshed blocklists
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/blocklists/*.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh threat-intel blocklists [automated $(date -u +%Y-%m-%d)]"
          git fetch origin main
          if git rebase origin/main; then
            git push origin main
            echo "Blocklists pushed."
          else
            git rebase --abort || true
            echo "Rebase conflict — will retry next run."
          fi
