name: Inject JS cache-bust version into index.html

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace ?v= query strings with current date+hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          BUILD="${DATE}-${HASH}"
          echo "Cache-busting with: $BUILD"
          sed -i -E "s/\.(js|css)\?v=[a-zA-Z0-9_-]+/.\1?v=${BUILD}/g" docs/index.html
          echo "Done. Sample:"
          grep "?v=" docs/index.html | head -3

      - name: Commit updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: bump JS/CSS cache-bust version [auto]"
          git fetch origin main
          if git rebase origin/main; then
            git push origin main
            echo "index.html pushed."
          else
            git rebase --abort || true
            echo "Rebase conflict — will retry next push."
          fi
