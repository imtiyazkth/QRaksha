name: QRaksha TWA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone TWA template
        run: |
          git clone --depth 1 \
            https://github.com/GoogleChromeLabs/svgomg-twa.git twa-build

      - name: Upgrade Gradle to 8.9
        run: |
          cd twa-build
          sed -i 's|gradle-4.6-all|gradle-8.9-all|g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-.*-all|gradle-8.9-all|g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade build.gradle for Java 17
        run: |
          cd twa-build
          # Update compileSdkVersion and targetSdkVersion
          sed -i 's/compileSdkVersion 28/compileSdkVersion 34/g' app/build.gradle
          sed -i 's/targetSdkVersion 28/targetSdkVersion 34/g' app/build.gradle
          sed -i 's/compileSdkVersion 29/compileSdkVersion 34/g' app/build.gradle
          sed -i 's/targetSdkVersion 29/targetSdkVersion 34/g' app/build.gradle
          # Update classpath in root build.gradle
          sed -i "s|classpath 'com.android.tools.build:gradle:.*'|classpath 'com.android.tools.build:gradle:8.1.0'|g" build.gradle
          cat app/build.gradle

      - name: Configure QRaksha TWA
        run: |
          cd twa-build
          # Package ID
          sed -i 's|com.svgomg.twa|com.qraksha.app|g' app/build.gradle
          # Host
          find . -name "*.xml" -exec sed -i 's|svgomg.firebaseapp.com|imtiyazkth.github.io|g' {} \;
          find . -name "*.xml" -exec sed -i 's|svgomg\.firebaseapp\.com|imtiyazkth.github.io|g' {} \;
          find . -name "*.gradle" -exec sed -i 's|svgomg.firebaseapp.com|imtiyazkth.github.io|g' {} \;
          # Start URL
          find . -name "*.xml" -exec sed -i 's|https://svgomg.firebaseapp.com|https://imtiyazkth.github.io/QRaksha/|g' {} \;
          # App name
          find . -name "strings.xml" -exec sed -i 's|SVGOMG|QRaksha|g' {} \;
          find . -name "strings.xml" -exec sed -i 's|Svgomg|QRaksha|g' {} \;

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias qraksha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass qraksha123 \
            -keypass qraksha123 \
            -dname "CN=QRaksha,OU=App,O=QRaksha,L=India,ST=India,C=IN" \
            -noprompt
          cp android.keystore twa-build/

      - name: Build debug APK
        run: |
          cd twa-build
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRaksha-debug-APK
          path: twa-build/app/build/outputs/apk/debug/*.apk
          retention-days: 30
