name: Build TWA Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap non-interactive
        run: npm install -g @bubblewrap/cli

      - name: Create TWA project with Bubblewrap (non-interactive)
        run: |
          mkdir -p twa-build
          cd twa-build
          bubblewrap init \
            --manifest "https://imtiyazkth.github.io/QRaksha/manifest.json" \
            --directory . \
            --jdkPath "$JAVA_HOME" \
            --androidSdkPath "$ANDROID_SDK_ROOT" \
            --skipPwaValidation \
            --yesAll || true

      - name: Generate keystore
        run: |
          cd twa-build
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias qraksha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass qraksha123 \
            -keypass qraksha123 \
            -dname "CN=QRaksha,OU=App,O=QRaksha,L=India,ST=India,C=IN" \
            -noprompt

      - name: Build APK
        run: |
          cd twa-build
          bubblewrap build \
            --skipPwaValidation \
            --jdkPath "$JAVA_HOME" \
            --androidSdkPath "$ANDROID_SDK_ROOT"

      - name: Find APK
        run: find twa-build -name "*.apk" | head -10

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRaksha-APK
          path: |
            twa-build/**/*.apk
            twa-build/**/*.aab
          retention-days: 30
