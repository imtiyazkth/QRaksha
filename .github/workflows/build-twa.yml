name: QRaksha TWA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create TWA project structure
        run: |
          mkdir -p twa-build/app/src/main/res/values
          mkdir -p twa-build/app/src/main/res/xml
          mkdir -p twa-build/app/src/main/res/drawable
          mkdir -p twa-build/gradle/wrapper

      - name: Write settings.gradle
        run: |
          cat > twa-build/settings.gradle << 'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "QRaksha"
          include ':app'
          EOF

      - name: Write root build.gradle
        run: |
          cat > twa-build/build.gradle << 'EOF'
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.0'
            }
          }
          EOF

      - name: Write app build.gradle
        run: |
          cat > twa-build/app/build.gradle << 'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.qraksha.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.qraksha.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0.0'
            }
            buildTypes {
              debug {
                debuggable true
              }
            }
          }
          dependencies {
            implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

      - name: Write AndroidManifest.xml
        run: |
          cat > twa-build/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="QRaksha"
              android:theme="@style/Theme.AppCompat.NoActionBar">
              <activity
                android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                android:exported="true">
                <meta-data
                  android:name="android.support.customtabs.trusted.DEFAULT_URL"
                  android:value="https://imtiyazkth.github.io/QRaksha/" />
                <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="https"
                        android:host="imtiyazkth.github.io"
                        android:pathPrefix="/QRaksha"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Write strings.xml
        run: |
          cat > twa-build/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">QRaksha</string>
          </resources>
          EOF

      - name: Setup Gradle Wrapper and Executables
        run: |
          cat > twa-build/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar \
            -o twa-build/gradle/wrapper/gradle-wrapper.jar

          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew \
            -o twa-build/gradlew

          chmod +x twa-build/gradlew

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore twa-build/android.keystore \
            -alias qraksha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass qraksha123 \
            -keypass qraksha123 \
            -dname "CN=QRaksha,OU=App,O=QRaksha,L=India,ST=India,C=IN" \
            -noprompt

      - name: Build APK
        run: |
          cd twa-build
          ./gradlew assembleDebug
          echo "=== Finding APK files ==="
          find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRaksha-APK
          path: twa-build/**/*.apk
          if-no-files-found: error
          retention-days: 30
