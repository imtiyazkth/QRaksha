name: QRaksha TWA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone TWA template
        run: |
          git clone --depth 1 \
            https://github.com/GoogleChromeLabs/svgomg-twa.git twa-build

      - name: Configure TWA app
        run: |
          cd twa-build
          sed -i 's|com.svgomg.twa|com.qraksha.app|g' app/build.gradle
          sed -i 's|svgomg.firebaseapp.com|imtiyazkth.github.io|g' app/src/main/AndroidManifest.xml
          sed -i 's|https://svgomg.firebaseapp.com|https://imtiyazkth.github.io/QRaksha/|g' app/src/main/res/values/strings.xml || true

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias qraksha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass qraksha123 \
            -keypass qraksha123 \
            -dname "CN=QRaksha,OU=App,O=QRaksha,L=India,ST=India,C=IN" \
            -noprompt
          cp android.keystore twa-build/

      - name: Build debug APK
        run: |
          cd twa-build
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRaksha-debug-APK
          path: twa-build/app/build/outputs/apk/debug/*.apk
          retention-days: 30
