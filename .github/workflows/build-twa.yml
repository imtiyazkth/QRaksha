name: QRaksha TWA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project structure
        run: |
          mkdir -p twa-build/app/src/main/java/com/qraksha/app
          mkdir -p twa-build/app/src/main/res/values
          mkdir -p twa-build/gradle/wrapper

      - name: Write LinkScanActivity.java
        run: |
          cat > twa-build/app/src/main/java/com/qraksha/app/LinkScanActivity.java << 'EOF'
          package com.qraksha.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          public class LinkScanActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              String incomingUrl = "";
              Intent intent = getIntent();
              if (intent != null && intent.getData() != null) {
                incomingUrl = intent.getData().toString();
              }
              String scanUrl = "https://qraksha-india.web.app/?url=" +
                Uri.encode(incomingUrl);
              Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(scanUrl));
              startActivity(browserIntent);
              finish();
            }
          }
          EOF

      - name: Write AndroidManifest.xml
        run: |
          cat > twa-build/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
              android:label="QRaksha"
              android:icon="@android:drawable/sym_def_app_icon"
              android:theme="@style/Theme.AppCompat.Light.NoActionBar">

              <!-- Main TWA Activity — home screen launcher -->
              <activity
                android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                android:exported="true">
                <meta-data
                  android:name="android.support.customtabs.trusted.DEFAULT_URL"
                  android:value="https://qraksha-india.web.app/" />
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>

              <!-- Link Scanner Activity — intercepts ALL links, sends to QRaksha scanner -->
              <activity
                android:name=".LinkScanActivity"
                android:exported="true"
                android:label="QRaksha — Check this link">
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="http"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="https"/>
                </intent-filter>
              </activity>

            </application>
          </manifest>
          EOF

      - name: Write strings.xml
        run: |
          cat > twa-build/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">QRaksha</string>
          </resources>
          EOF

      - name: Write settings.gradle
        run: |
          cat > twa-build/settings.gradle << 'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "QRaksha"
          include ':app'
          EOF

      - name: Write root build.gradle
        run: |
          cat > twa-build/build.gradle << 'EOF'
          buildscript {
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.0'
            }
          }
          EOF

      - name: Write app build.gradle
        run: |
          cat > twa-build/app/build.gradle << 'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.qraksha.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.qraksha.app'
              minSdk 21
              targetSdk 34
              versionCode 3
              versionName '1.2.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            buildTypes {
              debug { debuggable true }
            }
          }
          dependencies {
            implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Write gradle wrapper
        run: |
          cat > twa-build/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL https://raw.githubusercontent.com/gradle/gradle/master/gradlew \
            -o twa-build/gradlew
          chmod +x twa-build/gradlew

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore twa-build/android.keystore \
            -alias qraksha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass qraksha123 \
            -keypass qraksha123 \
            -dname "CN=QRaksha,OU=App,O=QRaksha,L=India,ST=India,C=IN" \
            -noprompt

      - name: Build APK
        run: |
          cd twa-build
          ./gradlew assembleDebug
          find . -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRaksha-APK
          path: twa-build/**/*.apk
          retention-days: 30
