name: Build TWA Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone TWA Quickstart template
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa-build
          cd twa-build
          # Update app config
          cat > app/build.gradle << 'GRADLE'
apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.qraksha.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders = [
            hostName: "imtiyazkth.github.io",
            defaultUrl: "https://imtiyazkth.github.io/QRaksha/",
            launcherName: "QRaksha",
            appThemeColors: "@style/AppTheme"
        ]
    }
    signingConfigs {
        release {
            storeFile file("../android.keystore")
            storePassword "qraksha123"
            keyAlias "qraksha"
            keyPassword "qraksha123"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
GRADLE

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias qraksha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass qraksha123 \
            -keypass qraksha123 \
            -dname "CN=QRaksha,OU=App,O=QRaksha,L=India,ST=India,C=IN" \
            -noprompt

      - name: Build APK
        run: |
          cd twa-build
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRaksha-APK
          path: twa-build/app/build/outputs/apk/**/*.apk
          retention-days: 30

